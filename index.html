<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonic Play 6 — by sonic</title>
  <style>
    :root {
      --bg: #0c0e16;
      --card: #141826;
      --line: #243044;
      --gold: #e7b15a;
      --text: #f4efe6;
      --muted: #b7ad9e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(900px 400px at 80% -10%, rgba(231, 177, 90, 0.16), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    main {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 36px 28px 28px;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: var(--gold);
      font-size: 42px;
      letter-spacing: 0.5px;
    }
    .by {
      margin: 6px 0 22px;
      color: var(--muted);
      font-weight: 700;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }
    .btn {
      display: block;
      width: 100%;
      background: var(--gold);
      color: #241a0c;
      text-decoration: none;
      font-weight: 800;
      font-size: 22px;
      border-radius: 14px;
      padding: 16px 18px;
    }
    .btn:hover { filter: brightness(1.05); }
    .size {
      margin: 12px 0 22px;
      color: var(--muted);
      font-size: 14px;
    }
    ol {
      margin: 0;
      padding: 0 18px 0 0;
      text-align: right;
      color: var(--text);
      line-height: 1.85;
    }
    li { margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Sonic Play 6</h1>

    <p>اضغط الزر. يحمل ملف فيه البرنامج وإعدادات sonic جاهزة.</p>
